$kind: http-request
url: "{{baseUrl}}/users/:id"
method: GET
pathVariables:
  id: u1
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is JSON", function () {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Get user by id response body has expected shape", function () {
        const data = pm.response.json();
        pm.expect(data).to.be.an("object");

        if (pm.response.code === 200) {
          pm.expect(data.user).to.be.an("object");
          pm.expect(data.user.id).to.be.a("string").and.not.empty;
          pm.expect(data.user.name).to.be.a("string").and.not.empty;
          pm.expect(data.user.email).to.be.a("string").and.to.include("@");
        } else {
          pm.expect(data.error).to.eql("user not found");
        }
      });
    language: text/javascript
order: 2000
