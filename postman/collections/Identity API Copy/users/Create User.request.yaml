$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Alice",
      "email": "alice@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 201", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is JSON", function () {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Create user response body has expected shape", function () {
        const data = pm.response.json();
        pm.expect(data).to.be.an("object");
        pm.expect(data.user).to.be.an("object");
        pm.expect(data.user.id).to.be.a("string").and.not.empty;
        pm.expect(data.user.name).to.be.a("string").and.not.empty;
        pm.expect(data.user.email).to.be.a("string").and.to.include("@");

        if (pm.response.code === 200) {
          pm.expect(data.existing).to.eql(true);
        }
      });
    language: text/javascript
order: 1000
