$kind: http-request
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response time is under 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is JSON", function () {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("List users response body has expected shape", function () {
        const data = pm.response.json();
        pm.expect(data).to.be.an("object");
        pm.expect(data.users).to.be.an("array");

        data.users.forEach((user) => {
          pm.expect(user).to.be.an("object");
          pm.expect(user.id).to.be.a("string").and.not.empty;
          pm.expect(user.name).to.be.a("string").and.not.empty;
          pm.expect(user.email).to.be.a("string").and.to.include("@");
        });
      });
    language: text/javascript
order: 3000
